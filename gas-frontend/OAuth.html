<body>
<div class="shell">
  <header class="brand" aria-label="Sennin Account"><span>Sennin<span class="brand-accent">Account</span></span></header>
  <main class="card" id="card">
    <section id="mainContent">
      <h1>アプリと連携</h1>
      <p class="intro">アカウントでログインして連携します。</p>
      <section class="app-card" aria-label="認可を要求しているアプリ">
        <div class="app-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><rect x="3.25" y="3.25" width="17.5" height="17.5" rx="5" stroke="currentColor" stroke-width="1.6"/><path d="M7 15.5 10 8.5l2.1 5 2.2-3 2.7 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div class="app-info"><div class="overline">連携するアプリ</div><div class="app-name" id="appName">登録情報を確認中...</div><div class="app-description" id="appDescription"></div></div>
        <div class="origin-label" id="appStatus"><svg viewBox="0 0 20 20" fill="none"><path d="m5 10 3.2 3.2L15.5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>登録済み</div>
      </section>
      <div class="error" id="error" role="alert" aria-live="assertive"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/><path d="M12 7.5v5.2m0 3.1v.1" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg><div class="error-copy" id="errorText"></div></div>
      <section class="meta-list" aria-label="アプリの接続情報">
        <div class="meta-row"><div class="meta-key">接続先</div><div class="meta-value" id="redirectUri">確認中...</div></div>
      </section>
      <section aria-labelledby="scopeHeading"><div class="heading-row"><h2 id="scopeHeading">アクセスする情報</h2><span class="count" id="scopeCount"></span></div><ul class="scopes" id="scopes"></ul></section>
      <section id="accountBox" class="hidden" aria-live="polite" style="margin-bottom:18px;padding:16px;border:1px solid #d1fadf;border-radius:12px;background:#f6fef9">
        <div style="font-size:12px;font-weight:800;margin-bottom:6px">このアカウントでよろしいでしょうか？</div>
        <div id="currentAccount" style="font-size:13px;color:#344054;overflow-wrap:anywhere;margin-bottom:12px"></div>
        <button class="button primary" id="continueAccount" type="button">このアカウントで続行</button>
        <button class="button secondary" id="switchAccount" type="button">別のアカウントを使用</button>
      </section>
      <div id="modeChoices" style="display:flex;gap:8px;margin-bottom:12px">
        <button class="button secondary" id="loginMode" type="button" style="margin-top:0;flex:1">ログイン</button>
        <button class="button secondary" id="registerMode" type="button" style="margin-top:0;flex:1">新規登録</button>
      </div>
      <form id="authForm" novalidate>
        <div class="field hidden" id="nameField"><label for="regName">名前</label><input id="regName" name="name" autocomplete="name" maxlength="80" placeholder="表示名" style="padding-left:13px"></div>
        <div class="field"><label for="email">メールアドレス</label><div class="input-wrap"><svg class="input-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3" stroke="currentColor" stroke-width="1.7"/><path d="m4 7 8 6 8-6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><input id="email" name="email" type="email" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" required maxlength="320" placeholder="you@example.com"></div></div>
        <div class="field"><label for="password">パスワード</label><div class="input-wrap"><svg class="input-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2.5" stroke="currentColor" stroke-width="1.7"/><path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg><input class="password-input" id="password" name="password" type="password" autocomplete="current-password" required maxlength="200" placeholder="パスワード"><button class="toggle" id="togglePassword" type="button" aria-label="パスワードを表示" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2.5 12s3.4-6.5 9.5-6.5 9.5 6.5 9.5 6.5-3.4 6.5-9.5 6.5S2.5 12 2.5 12Z" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7"/></svg></button></div></div>
        <button class="button primary" id="allow" type="submit"><span class="spinner" aria-hidden="true"></span><svg class="arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="allowText">ログインして連携</span></button>
        <button class="button secondary" id="deny" type="button">許可しない</button>
      </form>
      <div class="notice"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2.5" stroke="currentColor" stroke-width="1.7"/><path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg><div>連携はいつでもアカウント設定から解除できます。</div></div>
    </section>
    <section id="continueBox" class="continue hidden" aria-live="polite"><div class="success-icon" id="resultIcon"><svg viewBox="0 0 24 24" fill="none"><path d="m5 12 4.5 4.5L19 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div><h1 id="continueTitle">認証処理が完了しました</h1><p id="continueText"></p><button class="button primary" id="continueBtn" type="button"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14m-6-6 6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>アプリに戻る</button></section>
    <div class="lock"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2.5" stroke="currentColor" stroke-width="1.6"/><path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>安全なアカウント連携</div>
  </main>
  <footer class="foot">Sennin Account</footer>
</div>
<script>
(function(){
'use strict';
var P = <?!= oauthJson ?>;
var $ = function(id){ return document.getElementById(id); };
var redirectTarget = '', submitting = false, mode = 'login', registerStage = false, currentToken = '';
var requestValid = !!(P && P.client_id && P.redirect_uri && P.response_type === 'code');
var labels = {

 email:['メールアドレス','メールアドレスと確認状態を参照します。'],
 'points:read':['ポイント残高','ポイント残高を参照します。'],
 'points:write':['ポイントの加算・減算','ポイントを変更する権限です。強い権限のため、信頼できるアプリだけ許可してください。']
};
function showError(message){ $('errorText').textContent=message||'認可に失敗しました。入力内容を確認してください。'; $('error').classList.add('show'); }
function hideError(){ $('error').classList.remove('show'); $('errorText').textContent=''; }
function busy(on){ submitting=on; $('card').classList.toggle('busy',on); $('allow').disabled=on||!requestValid||!P.client_metadata_ok; $('deny').disabled=on||!requestValid; ['email','password','regName','verifyCode','togglePassword','loginMode','registerMode','continueAccount','switchAccount'].forEach(function(id){var e=$(id);if(e)e.disabled=on;}); }
function renderScopes(){
 var scopes=String(P.scope||'profile').trim().split(/\s+/).filter(Boolean),list=$('scopes');list.textContent='';$('scopeCount').textContent=scopes.length+' 件';
 if(!scopes.length){var li=document.createElement('li');li.className='scope';li.textContent='要求された権限がありません。';list.appendChild(li);return;}
 scopes.forEach(function(scope){var info=labels[scope]||[scope,'このアプリが要求するアクセス権です。'];var li=document.createElement('li');li.className='scope';var icon=document.createElement('span');icon.className='scope-icon'+(scope==='points:write'?' warn':'');icon.setAttribute('aria-hidden','true');icon.innerHTML='<svg viewBox="0 0 20 20" fill="none"><path d="m4 10 4 4 8-8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';var body=document.createElement('div');body.className='scope-body';var title=document.createElement('div');title.className='scope-title';title.textContent=info[0];var desc=document.createElement('div');desc.className='scope-desc';desc.textContent=info[1];var code=document.createElement('span');code.className='scope-code';code.textContent=scope;body.appendChild(title);body.appendChild(desc);body.appendChild(code);li.appendChild(icon);li.appendChild(body);list.appendChild(li);});
}
function renderMetadata(){
 var name=typeof P.client_name==='string'?P.client_name.trim():'';$('appName').textContent=name||'登録済みアプリ名を取得できません';$('appDescription').textContent=(typeof P.client_description==='string'?P.client_description.trim():'')||'登録済みのアプリ';$('redirectUri').textContent=P.redirect_uri||'未指定';
 if(!requestValid){showError('OAuth リクエストが不足または不正です。Client ID、Redirect URI、response_type=code を確認してください。');$('allow').disabled=true;$('deny').disabled=true;return;}
 if(!P.client_metadata_ok||!name){$('appStatus').classList.add('hidden');showError('登録済みアプリ情報を安全に取得できませんでした。アプリ名を確認できないため、アクセス許可を停止しました。'+(P.client_metadata_error?' 詳細: '+P.client_metadata_error:''));$('allow').disabled=true;$('deny').disabled=false;}else{$('allow').disabled=false;$('deny').disabled=false;}
}
function setMode(next){mode=next;registerStage=false;hideError();$('nameField').classList.toggle('hidden',mode!=='register');$('codeField').classList.add('hidden');$('password').classList.remove('hidden');$('modeChoices').classList.remove('hidden');$('allowText').textContent=mode==='register'?'認証コードを送信':'ログインして連携';$('loginMode').style.background=mode==='login'?'#eff6ff':'#fff';$('registerMode').style.background=mode==='register'?'#eff6ff':'#fff';$('allow').disabled=!requestValid||!P.client_metadata_ok;}
function rpc(action,payload,token,done){google.script.run.withSuccessHandler(function(r){done(r||{ok:false,error:'応答がありません'});}).withFailureHandler(function(){done({ok:false,error:'通信に失敗しました。もう一度お試しください。'});}).api(action,payload||{},token||'');}

function showContinue(result){redirectTarget=result.redirect;$('mainContent').classList.add('hidden');$('continueBox').classList.remove('hidden');var denied=result.denied===true;$('continueTitle').textContent=denied?'連携をキャンセルしました':'連携が完了しました';$('continueText').textContent=denied?'連携をキャンセルしました。元のアプリに戻ってください。':'連携が完了しました。元のアプリに戻ってください。';if(denied)$('resultIcon').classList.add('hidden');$('card').classList.remove('busy');}
function authorizeByCredentials(){var email=$('email').value.trim(),password=$('password').value;if(mode==='register'&&!registerStage){if(!$('regName').value.trim()||!email||!password){showError('名前、メールアドレス、パスワードを入力してください。');return;}rpc('register',{name:$('regName').value.trim(),email:email,password:password},'',function(r){busy(false);if(!r.ok){showError(r.error||'登録に失敗しました。');return;}registerStage=true;$('codeField').classList.remove('hidden');$('allowText').textContent='認証して連携';$('modeChoices').classList.add('hidden');showError('メールに届いた6桁の認証コードを入力してください。');$('error').style.background='#eff6ff';$('error').style.color='#1d4ed8';});return;}
 if(mode==='register'&&registerStage){var code=$('verifyCode').value.trim();if(!/^\d{6}$/.test(code)){busy(false);showError('メール認証コードは6桁で入力してください。');return;}rpc('verifyEmailCode',{email:email,code:code},'',function(v){if(!v.ok){busy(false);showError(v.error||'認証コードを確認できませんでした。');return;}loginAndAuthorize(email,password);});return;}
 if(!email||!password){busy(false);showError('メールアドレスとパスワードを入力してください。');return;}loginAndAuthorize(email,password);}
function loginAndAuthorize(email,password){rpc('login',{email:email,password:password,device:'OAuth連携'},'',function(r){$('password').value='';if(!r||!r.ok||!r.token){busy(false);showError(r&&r.error?r.error:'ログインに失敗しました。');return;}oauthWithSession(r.token);});}
function submit(decision){if(submitting)return;hideError();if(!requestValid){showError('OAuth リクエストが正しくないため処理できません。');return;}if(decision==='deny'){busy(true);google.script.run.withSuccessHandler(function(r){if(r&&r.ok&&r.redirect){showContinue(r);return;}busy(false);showError(r&&r.error?r.error:'キャンセル処理に失敗しました。');}).withFailureHandler(function(){busy(false);showError('キャンセル処理に接続できませんでした。');}).oauthAuthorize({client_id:P.client_id,redirect_uri:P.redirect_uri,response_type:P.response_type,scope:P.scope,state:P.state,code_challenge:P.code_challenge,code_challenge_method:P.code_challenge_method,decision:'deny'});return;}if(!P.client_metadata_ok||!P.client_name){showError('登録済みアプリ名を確認できないため許可できません。');return;}if(!$('authForm').reportValidity())return;busy(true);authorizeByCredentials();}
function useCurrentAccount(token,user){currentToken=token;$('currentAccount').textContent=(user.name||'')+'（'+(user.email||'')+'）';$('accountBox').classList.remove('hidden');$('modeChoices').classList.add('hidden');$('authForm').classList.add('hidden');$('allow').disabled=false;$('continueAccount').onclick=function(){hideError();busy(true);oauthWithSession(currentToken);};$('switchAccount').onclick=function(){$('accountBox').classList.add('hidden');$('authForm').classList.remove('hidden');$('modeChoices').classList.remove('hidden');setMode('login');$('email').value='';$('password').value='';};}
$('authForm').addEventListener('submit',function(e){e.preventDefault();submit('allow');});$('deny').addEventListener('click',function(){submit('deny');});$('continueBtn').addEventListener('click',function(){if(redirectTarget)window.top.location.href=redirectTarget;});$('loginMode').addEventListener('click',function(){setMode('login');});$('registerMode').addEventListener('click',function(){setMode('register');});
$('togglePassword').addEventListener('click',function(){var input=$('password'),visible=input.type==='password';input.type=visible?'text':'password';$('togglePassword').setAttribute('aria-label',visible?'パスワードを隠す':'パスワードを表示');$('togglePassword').setAttribute('aria-pressed',visible?'true':'false');});
renderScopes();renderMetadata();setMode('login');
try{var saved=localStorage.getItem('sennin_session')||'';if(/^ses_[A-Za-z0-9_-]{20,80}$/.test(saved)){rpc('me',{},saved,function(r){if(r&&r.ok&&r.user)useCurrentAccount(saved,r.user);});}}catch(e){}
})();
